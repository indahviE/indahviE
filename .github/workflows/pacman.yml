name: Generate Pink Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate pink snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-pink.svg?color_snake=#e0679a&color_dots=#ffeef5,#f9c6da,#f4a6c0,#ec7fa5,#d6477f
            dist/snake-pink-dark.svg?color_snake=#ffb6d1&color_dots=#3a2530,#7a3d57,#a64d72,#d6648f,#ff8fb8

      - name: Push SVG ke branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
